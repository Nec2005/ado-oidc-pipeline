trigger:
  branches:
    include:
      - main
  paths:
    include:
      - terraform/*

pr:
  branches:
    include:
      - development
      - main
  paths:
    include:
      - terraform/*
      - azure-pipelines.yaml

pool:
  vmImage: 'ubuntu-latest'

variables:
  - name: AWS_REGION
    value: 'eu-west-1'
  - name: SERVICE_CONNECTION_NAME
    value: 'AWS-necatidev-533267146698'
  - name: TERRAFORM_VERSION
    value: '1.13.4'

stages:
  - stage: Plan
    displayName: 'Terraform Plan'
    jobs:
      - job: TerraformPlan
        displayName: 'Run Terraform Plan'
        steps:
          - checkout: self

          - task: TerraformInstaller@1
            displayName: 'Install Terraform'
            inputs:
              terraformVersion: $(TERRAFORM_VERSION)

          - task: AWSShellScript@1
            displayName: 'Terraform Init & Plan'
            inputs:
              awsCredentials: $(SERVICE_CONNECTION_NAME)
              regionName: $(AWS_REGION)
              scriptType: 'inline'
              inlineScript: |
                set -e

                echo "Verifying AWS credentials..."
                aws sts get-caller-identity

                cd terraform

                echo "Initializing Terraform..."
                terraform init

                echo "Running Terraform plan..."
                terraform plan -out=tfplan

                echo "Showing plan..."
                terraform show -no-color tfplan

          - task: PublishPipelineArtifact@1
            displayName: 'Publish Terraform Plan'
            inputs:
              targetPath: 'terraform'
              artifact: 'terraform-plan'

  - stage: Apply
    displayName: 'Terraform Apply'
    dependsOn: Plan
    condition: |
      and(
        succeeded(),
        or(
          eq(variables['System.PullRequest.TargetBranch'], 'refs/heads/main'),
          eq(variables['System.PullRequest.TargetBranch'], 'refs/heads/development')
        )
      )
    jobs:
      - deployment: TerraformApply
        displayName: 'Apply Terraform Changes'
        environment: 'dev'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: TerraformInstaller@1
                  displayName: 'Install Terraform'
                  inputs:
                    terraformVersion: $(TERRAFORM_VERSION)

                - task: DownloadPipelineArtifact@2
                  displayName: 'Download Terraform Plan'
                  inputs:
                    artifact: 'terraform-plan'
                    path: '$(System.DefaultWorkingDirectory)/terraform'

                - task: AWSShellScript@1
                  displayName: 'Terraform Apply'
                  inputs:
                    awsCredentials: $(SERVICE_CONNECTION_NAME)
                    regionName: $(AWS_REGION)
                    scriptType: 'inline'
                    inlineScript: |
                      set -e

                      echo "Verifying AWS credentials..."
                      aws sts get-caller-identity

                      cd terraform

                      echo "Initializing Terraform..."
                      terraform init

                      echo "Applying Terraform plan..."
                      terraform apply -auto-approve tfplan

                      echo "Terraform outputs:"
                      terraform output -json
