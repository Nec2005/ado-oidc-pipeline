trigger:
  branches:
    include:
      - main
      - development
  paths:
    include:
      - terraform/*
      - azure-pipelines.yaml

pr:
  branches:
    include:
      - development
      - main
  paths:
    include:
      - terraform/*
      - azure-pipelines.yaml

pool:
  vmImage: 'ubuntu-latest'

variables:
  - name: AWS_REGION
    value: 'eu-west-1'
  - name: SERVICE_CONNECTION_NAME
    value: 'AWS-necatidev-533267146698'
  - name: SERVICE_CONNECTION_ID
    value: '82774356-daf9-4ea3-b272-747532c6fcd9'
  - name: TERRAFORM_VERSION
    value: '1.13.4'
  - name: TF_PLUGIN_CACHE_DIR
    value: $(Pipeline.Workspace)/.terraform.d/plugin-cache

stages:
  - stage: Plan
    displayName: 'Terraform Plan'
    jobs:
      - job: TerraformPlan
        displayName: 'Run Terraform Plan'
        steps:
          - checkout: self

          # Create the cache directory so the Cache task doesn't fail
          - script: mkdir -p $(TF_PLUGIN_CACHE_DIR)
            displayName: 'Create Plugin Cache Dir'

          - task: Cache@2
            displayName: 'Cache Terraform Providers'
            inputs:
              key: 'terraform | "linux" | terraform/.terraform.lock.hcl'
              restoreKeys: |
                terraform | "linux"
              path: $(TF_PLUGIN_CACHE_DIR)

          - task: TerraformInstaller@1
            inputs:
              terraformVersion: $(TERRAFORM_VERSION)

          - task: AzureCLI@2
            inputs:
              azureSubscription: $(SERVICE_CONNECTION_ID)
              scriptType: bash
              scriptLocation: "inlineScript"
              inlineScript: |
                set -e
                cd terraform
                terraform init -input=false
                terraform plan -out=tfplan

            env:
              ARM_USE_OIDC: true
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)
              SYSTEM_OIDCREQUESTURI: $(System.OidcRequestUri)
              ARM_ADO_PIPELINE_SERVICE_CONNECTION_ID: $(SERVICE_CONNECTION_ID)


          # - task: AzureCLI@2
          #   displayName: 'Terraform Plan/Apply (AWS + Azure DevOps)'
          #   inputs:
          #     azureSubscription: $(SERVICE_CONNECTION_ID) # OIDC enabled connection
          #     scriptType: bash
          #     scriptLocation: inlineScript
          #     # Important: This makes the $idToken available in the script
          #     addSpnToEnvironment: true
          #     inlineScript: |
          #       # 1. AWS OIDC Configuration
          #       export AWS_WEB_IDENTITY_TOKEN_FILE=$(mktemp)
          #       echo "$idToken" > "$AWS_WEB_IDENTITY_TOKEN_FILE"
          #       export AWS_ROLE_ARN="arn:aws:iam::533267146698:role/ADODeploymentRole"
          #       export AWS_WEB_IDENTITY_TOKEN_FILE=$AWS_WEB_IDENTITY_TOKEN_FILE
          #       export AWS_ROLE_SESSION_NAME="AzureDevOpsTerraform"
          #       export AWS_REGION="eu-west-1" # MUST be set for S3 backend

          #       # 2. Azure DevOps Provider Configuration
          #       # Map the task-provided variables to the ARM_ naming convention
          #       export ARM_CLIENT_ID=$servicePrincipalId
          #       export ARM_TENANT_ID=$tenantId
          #       export ARM_OIDC_TOKEN=$idToken
          #       export ARM_USE_OIDC=true
          #       export AZDO_ORG_SERVICE_URL="https://dev.azure.com/necdemo"

          #       # Debug: Extract the Issuer from the token
          #       echo "--- TOKEN DEBUG ---"
          #       echo $idToken | cut -d. -f2 | base64 -d | jq -r '.iss, .aud'
          #       echo "-------------------"

          #       # 3. Execution
          #       set -e
          #       cd terraform
          #       terraform init -input=false
          #       terraform plan -out=tfplan
          #   env:
          #     # Required for Azure/AzureDevOps OIDC
          #     SYSTEM_ACCESSTOKEN: $(System.AccessToken)
          #     SYSTEM_OIDCREQUESTURI: $(System.OidcRequestUri)

          # - task: AWSShellScript@1
          #   displayName: 'Terraform Init & Plan'
          #   inputs:
          #     awsCredentials: $(SERVICE_CONNECTION_NAME)
          #     regionName: $(AWS_REGION)
          #     scriptType: 'inline'
          #     inlineScript: |
          #       set -e
          #       cd terraform
          #       terraform init -input=false
          #       terraform plan -out=tfplan
          #       terraform show -no-color tfplan

          - task: PublishPipelineArtifact@1
            displayName: 'Publish Plan (Excluding .terraform)'
            inputs:
              targetPath: '$(System.DefaultWorkingDirectory)/terraform'
              artifact: 'terraform-plan'

  - stage: Apply
    displayName: 'Terraform Apply'
    dependsOn: Plan
    # Only runs on Merges (IndividualCI) to development or main branches
    condition: |
      and(
        succeeded(),
        eq(variables['Build.Reason'], 'IndividualCI'),
        or(
          eq(variables['Build.SourceBranch'], 'refs/heads/main'),
          eq(variables['Build.SourceBranch'], 'refs/heads/development')
        )
      )
    jobs:
      - deployment: TerraformApply
        displayName: 'Apply Terraform Changes'
        environment: 'dev'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - script: mkdir -p $(TF_PLUGIN_CACHE_DIR)
                  displayName: 'Create Plugin Cache Dir'

                - task: Cache@2
                  displayName: 'Cache Terraform Providers'
                  inputs:
                    key: 'terraform | "linux" | terraform/.terraform.lock.hcl'
                    restoreKeys: |
                      terraform | "linux"
                    path: $(TF_PLUGIN_CACHE_DIR)

                - task: TerraformInstaller@1
                  inputs:
                    terraformVersion: $(TERRAFORM_VERSION)

                - task: DownloadPipelineArtifact@2
                  displayName: 'Download Plan'
                  inputs:
                    artifact: 'terraform-plan'
                    path: '$(System.DefaultWorkingDirectory)/terraform'

                - task: AWSShellScript@1
                  displayName: 'Terraform Apply'
                  inputs:
                    awsCredentials: $(SERVICE_CONNECTION_NAME)
                    regionName: $(AWS_REGION)
                    scriptType: 'inline'
                    inlineScript: |
                      set -e
                      cd terraform

                      # Re-init uses the cache we restored above
                      terraform init -input=false

                      echo "Applying Terraform plan..."
                      terraform apply -auto-approve tfplan
